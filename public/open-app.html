<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening swypejobs</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050506;
      color: #fff;
      font-family: system-ui, sans-serif;
    "
  >
    <p id="msg">Opening swypejobs…</p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search)
        var hash = window.location.hash || ""
        var code = params.get("code")
        var url
        if (code) {
          url = "jobmatch://auth/callback?code=" + encodeURIComponent(code)
        } else if (hash.indexOf("access_token") !== -1) {
          url = "jobmatch://auth/callback" + hash
        } else {
          document.getElementById("msg").textContent =
            "Sign-in did not finish. Close this window and try again."
          return
        }
        document.getElementById("msg").innerHTML =
          '<a href="' + url + '" style="color:#fff">Continue in swypejobs</a>'
        window.location.replace(url)
      })()
    </script>
  </body>
</html>
